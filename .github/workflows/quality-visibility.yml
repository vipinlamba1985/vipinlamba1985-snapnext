name: Quality Visibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-visibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

  code-quality:
    name: Code quality visibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Blocking: both pass cleanly as of the flat-config migration, so a new
      # type error or lint error is a real regression rather than noise.
      - name: TypeScript check
        id: typescript
        run: npm run typecheck

      - name: ESLint check
        id: eslint
        run: npm run lint

      # Informational: the existing dependency backlog is tracked separately.
      - name: Dependency audit
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Publish quality summary
        if: always()
        run: |
          {
            echo '## SnapNext quality visibility'
            echo ''
            echo '| Check | Outcome |'
            echo '|---|---|'
            echo '| TypeScript | `${{ steps.typescript.outcome }}` |'
            echo '| ESLint | `${{ steps.eslint.outcome }}` |'
            echo '| Dependency audit (informational) | `${{ steps.audit.outcome }}` |'
            echo ''
            echo 'TypeScript and ESLint are required gates. ESLint reports remaining advisory findings as warnings, which do not fail the build; new errors do.'
          } >> "$GITHUB_STEP_SUMMARY"
