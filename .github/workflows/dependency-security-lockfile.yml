name: Dependency security lockfile refresh

on:
  push:
    branches: [agent/dependency-security-highs]

permissions:
  contents: write

concurrency:
  group: dependency-security-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/dependency-security-highs

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile for exact package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply non-force audit remediations to lockfile
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          echo "audit_fix_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0
        id: auditfix

      - name: Record post-fix high-severity audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high
          echo "audit_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0
        id: audit

      - name: Commit refreshed lock when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches the remediated dependency graph"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh lockfile after non-force audit remediation"
          git push origin HEAD:agent/dependency-security-highs
